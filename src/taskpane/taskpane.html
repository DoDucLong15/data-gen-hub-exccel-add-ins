<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Excel Data Mapper</title>
    <link rel="stylesheet" href="taskpane.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="taskpane.ts"></script>
</head>
<body>
    <div id="container">
        <h2>Excel Data Mapper</h2>

        <!-- Config Section -->
        <h3>Config</h3>
        <label>Name Format:</label>
        <input type="text" id="nameFormat" placeholder="e.g., PGNV_?last_name_?mssv" />
        <button onclick="addNameFormat()">Add</button>

        <!-- Sheet Section -->
        <h3>Sheets</h3>
        <div id="sheetCards"></div>
        <button onclick="addSheetCard()">+ Add New Sheet</button>

        <!-- Data Preview -->
        <h3>Data Preview</h3>
        <div id="spec-data"></div>

        <!-- Generate Button -->
        <button onclick="generateSpecFile()">Generate Spec File</button>
    </div>
</body>
</html>
