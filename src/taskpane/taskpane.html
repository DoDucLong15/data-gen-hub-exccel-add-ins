<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Excel Data Mapper</title>
    <link rel="stylesheet" href="taskpane.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="taskpane.ts"></script>
</head>
<body>
    <div id="container">
        <h2>Excel Data Mapper</h2>

        <!-- Config Section -->
        <div class="section">
            <h3>Cấu hình định dạng tên</h3>
            <div class="input-group">
                <label>Định dạng tên:</label>
                <div class="input-with-button">
                    <input type="text" id="nameFormat" placeholder="Ví dụ: PGNV_?last_name_?mssv" />
                    <button onclick="addNameFormat()">Thêm</button>
                </div>
                <small class="helper-text">Hiện tại: <span id="nameFormatDisplay">Chưa có định dạng</span></small>
            </div>
        </div>

        <!-- Sheet Section -->
        <div class="section">
            <h3>Danh sách Sheet</h3>
            <div id="sheetCards"></div>
            <button class="add-sheet-btn" onclick="addSheetCard()">
                <span>+</span> Thêm Sheet Mới
            </button>
        </div>

        <!-- Data Preview -->
        <div class="section">
            <h3>Xem trước dữ liệu</h3>
            <div id="spec-data"></div>
        </div>

        <!-- Generate Button -->
        <div class="section">
            <button class="generate-btn" onclick="generateSpecFile()">Tạo File Đặc Tả</button>
        </div>
    </div>
</body>
</html>
